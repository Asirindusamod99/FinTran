<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard – FinTran</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0b0f19; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 40px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .header h1 { margin: 0; font-size: 28px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 12px; }
    .header h1 i { color: #6366f1; }
    .card { background: #151b2b; border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; margin-bottom: 30px; }
    .card h2 { margin: 0 0 20px 0; font-size: 18px; color: #818cf8; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
    
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); }
    td { font-size: 14px; color: rgba(255,255,255,0.8); }
    
    .db-view { background: #000; border-radius: 8px; padding: 16px; margin-bottom: 15px; font-family: monospace; font-size: 13px; color: #a5b4fc; word-break: break-all; }
    .db-key { color: #34d399; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
    
    .btn { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s;}
    .btn:hover { background: #ef4444; color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fa-solid fa-user-shield"></i> Owner Dashboard</h1>
    <button class="btn" onclick="FinTran.logout()"><i class="fa-solid fa-power-off"></i> Logout</button>
  </div>

  <div class="card">
    <h2><i class="fa-solid fa-users" style="margin-right: 8px;"></i> Registered Users</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Email</th><th>Registration Date</th><th>Total Transactions</th><th>Total Budgets</th></tr>
      </thead>
      <tbody id="usersList"></tbody>
    </table>
  </div>

  <div class="card">
    <h2><i class="fa-solid fa-database" style="margin-right: 8px;"></i> Backend Details (LocalStorage Data)</h2>
    <div id="dbList"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Security check
    const u = FinTran.getUser();
    if (!u || u.role !== 'owner') {
      document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:100px;">Restricted Area - Redirecting...</h2>';
      setTimeout(() => window.location.href = 'login.html', 1500);
    }

    function init() {
      // Load users
      const users = JSON.parse(localStorage.getItem('ft_users') || '[]');
      const tb = document.getElementById('usersList');
      if (users.length === 0) {
        tb.innerHTML = '<tr><td colspan="5" style="text-align:center;color:gray;padding:30px;">No users registered yet.</td></tr>';
      } else {
        tb.innerHTML = users.map(user => {
          const txns = JSON.parse(localStorage.getItem('ft_transactions_' + user.id) || '[]');
          const buds = JSON.parse(localStorage.getItem('ft_budgets_' + user.id) || '[]');
          return `<tr>
            <td style="font-weight:bold;color:white;">${user.name}</td>
            <td>${user.email}</td>
            <td>${new Date(user.createdAt).toLocaleString()}</td>
            <td><span style="background:rgba(99,102,241,0.2);padding:4px 10px;border-radius:20px;color:#818cf8;font-weight:bold;">${txns.length} Txns</span></td>
            <td><span style="background:rgba(16,185,129,0.2);padding:4px 10px;border-radius:20px;color:#34d399;font-weight:bold;">${buds.length} Budgets</span></td>
          </tr>`;
        }).join('');
      }

      // Load DB
      let dbHtml = '';
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const val = localStorage.getItem(key);
        dbHtml += `<div class="db-view">
          <div class="db-key"><i class="fa-solid fa-key" style="margin-right: 5px; opacity: 0.7;"></i> ${key}</div>
          <div style="color:rgba(255,255,255,0.7);">${val.length > 500 ? val.substring(0,500) + '... (truncated)' : val}</div>
        </div>`;
      }
      document.getElementById('dbList').innerHTML = dbHtml || '<p style="color:gray;">Database is empty.</p>';
    }

    if (u && u.role === 'owner') {
      init();
    }
  </script>
</body>
</html>
