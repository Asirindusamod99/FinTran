<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – FinTran</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%236366f1%22/><text y=%22.9em%22 font-size=%2272%22 x=%2250%25%22 dominant-baseline=%22auto%22 text-anchor=%22middle%22>%F0%9F%92%B0</text></svg>">
  <script>(function(){const t=localStorage.getItem('ft_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; background: #090912; }
    /* Animated Fluid Colors */
    body::before {
      content: '';
      position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(99,102,241,.25) 0%, transparent 50%),
        radial-gradient(circle at 70% 30%, rgba(139,92,246,.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 70%, rgba(6,182,212,.15) 0%, transparent 50%);
      animation: fluidMove 15s ease-in-out infinite alternate; z-index: -1;
    }
    @keyframes fluidMove {
      0%   { transform: translate(0%, 0%) rotate(0deg) scale(1); }
      50%  { transform: translate(5%, 5%) rotate(5deg) scale(1.05); }
      100% { transform: translate(-3%, -5%) rotate(-2deg) scale(0.95); }
    }
    .reset-container {
      width: 440px; background: var(--bg-2); padding: 48px 44px; border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4); text-align: center; border: 1px solid rgba(255,255,255,0.05);
      position: relative; overflow: hidden;
    }
    .reset-header { margin-bottom: 32px; }
    .reset-header i { font-size: 48px; color: var(--accent); margin-bottom: 16px; display: block; }
    .reset-header h2 { font-size: 26px; font-weight: 800; color: var(--text-1); margin-bottom: 6px; }
    .reset-header p { font-size: 13px; color: var(--text-3); text-align: left; margin-bottom: 24px; text-align: center; }
    
    .login-form .form-group { margin-bottom: 18px; text-align: left; }
    
    .sign-in-btn {
      width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border: none;
      border-radius: var(--radius-sm); color: white; font-size: 14px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px;
    }
    .sign-in-btn:hover { box-shadow: 0 10px 28px rgba(99,102,241,.5); transform: translateY(-2px); }
    .sign-in-btn:disabled { opacity:.7; transform:none; cursor:not-allowed; }
    .back-link { display: inline-block; margin-top: 24px; font-size: 13px; color: var(--text-3); font-weight: 600; cursor: pointer; }
    .back-link:hover { color: var(--accent-light); }
    
    .step-section { display: none; animation: fadeIn 0.3s ease; }
    .step-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="reset-container">
  
  <!-- Step 1: Request OTP -->
  <div id="step1" class="step-section active">
    <div class="reset-header">
      <i class="fa-solid fa-envelope-open-text"></i>
      <h2>Forgot Password</h2>
      <p>Enter your email address and we'll send you an OTP to reset your password.</p>
    </div>
    <form class="login-form" onsubmit="requestOTP(event)">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>
      <button type="submit" class="sign-in-btn" id="btnStep1">
        <i class="fa-solid fa-paper-plane"></i> Send OTP
      </button>
    </form>
  </div>

  <!-- Step 2: Verify OTP -->
  <div id="step2" class="step-section">
    <div class="reset-header">
      <i class="fa-solid fa-shield-halved"></i>
      <h2>Verify OTP</h2>
      <p>Please enter the 6-digit code sent to your email.</p>
    </div>
    <form class="login-form" onsubmit="verifyOTP(event)">
      <div class="form-group">
        <label for="otpCode" class="form-label">OTP Code</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-hashtag input-icon"></i>
          <input type="text" id="otpCode" name="otpCode" class="form-control" placeholder="123456" maxlength="6" required style="letter-spacing: 4px; font-weight: bold; text-align: center;" autocomplete="one-time-code">
        </div>
      </div>
      <button type="submit" class="sign-in-btn" id="btnStep2">
        <i class="fa-solid fa-check-circle"></i> Verify Code
      </button>
    </form>
  </div>

  <!-- Step 3: New Password -->
  <div id="step3" class="step-section">
    <div class="reset-header">
      <i class="fa-solid fa-lock"></i>
      <h2>New Password</h2>
      <p>Create a secure new password for your account.</p>
    </div>
    <form class="login-form" onsubmit="resetPassword(event)">
      <div class="form-group">
        <label for="newPassword" class="form-label">New Password</label>
        <div class="input-with-icon" style="position:relative;">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="••••••••" required autocomplete="new-password">
          <button type="button" class="btn-icon" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:6px;" onclick="togglePassword()">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="sign-in-btn" id="btnStep3">
        <i class="fa-solid fa-key"></i> Update Password
      </button>
    </form>
  </div>

  <a onclick="window.location.href='login.html'" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
</div>

<script src="js/app.js"></script>
<script>
  let userEmail = '';
  let validOtp = '';

  function showStep(stepNum) {
    document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
    document.getElementById('step' + stepNum).classList.add('active');
  }

  function togglePassword() {
    const p = document.getElementById('newPassword');
    const ico = document.getElementById('eyeIcon');
    if (p.type === 'password') { p.type = 'text'; ico.className = 'fa-regular fa-eye-slash'; } 
    else { p.type = 'password'; ico.className = 'fa-regular fa-eye'; }
  }

  async function requestOTP(e) {
    e.preventDefault();
    const btn = document.getElementById('btnStep1');
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    btn.innerHTML = '<i class="fa-solid fa-circle-notch spin"></i> Sending...';
    btn.disabled = true;

    try {
      const res = await fetch(FinTran.apiUrl + '/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      userEmail = email;
      FinTran.toast('OTP sent! (Test OTP: ' + data.devOtp + ')', 'success');
      showStep(2);

    } catch (err) {
      FinTran.toast(err.message, 'error');
    } finally {
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send OTP';
      btn.disabled = false;
    }
  }

  async function verifyOTP(e) {
    e.preventDefault();
    const btn = document.getElementById('btnStep2');
    const otp = document.getElementById('otpCode').value.trim();
    if (!otp) return;

    btn.innerHTML = '<i class="fa-solid fa-circle-notch spin"></i> Verifying...';
    btn.disabled = true;

    try {
      const res = await fetch(FinTran.apiUrl + '/auth/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, otp })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      validOtp = otp;
      FinTran.toast('OTP Verified!', 'success');
      showStep(3);

    } catch (err) {
      FinTran.toast(err.message, 'error');
    } finally {
      btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> Verify Code';
      btn.disabled = false;
    }
  }

  async function resetPassword(e) {
    e.preventDefault();
    const btn = document.getElementById('btnStep3');
    const newPassword = document.getElementById('newPassword').value;
    if (!newPassword) return;

    btn.innerHTML = '<i class="fa-solid fa-circle-notch spin"></i> Updating...';
    btn.disabled = true;

    try {
      const res = await fetch(FinTran.apiUrl + '/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: userEmail, otp: validOtp, newPassword })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      FinTran.toast('Password updated successfully! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'login.html', 1500);

    } catch (err) {
      FinTran.toast(err.message, 'error');
      btn.innerHTML = '<i class="fa-solid fa-key"></i> Update Password';
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
